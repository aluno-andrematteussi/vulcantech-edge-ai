version: '3.8'

services:
  vulcantech-inference-edge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vulcantech_edge_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MODELS_DIR=/app/models
    volumes:
      - ../models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

